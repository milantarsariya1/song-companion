<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background glass ring/disk -->
  <circle cx="16" cy="16" r="14" fill="#121826" stroke="url(#grad)" stroke-width="2" filter="url(#glow)" />
  <!-- Musical note icon -->
  <path d="M13 22V11l9-2v11" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="10.5" cy="22" r="2.5" fill="url(#grad)" />
  <circle cx="19.5" cy="20" r="2.5" fill="url(#grad)" />
</svg>
